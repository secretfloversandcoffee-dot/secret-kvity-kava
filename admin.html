<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Адмін — Secret</title>
<style>
  :root{ --bg:#1b1715; --surface:#262120; --text:#f5ece5; --muted:#b9a99f; --line:#3a3330; --accent:#e08aa0; --accent-dark:#eea3b5; --teal:#86c3b6; --gold:#d9b676; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fbf6f0; --surface:#ffffff; --text:#2f2522; --muted:#7d6d66; --accent:#c4677f; --accent-dark:#a34e66; --teal:#5f9e91; --gold:#b8955a; --line:#eddfd3; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Marck Script','Bad Script',cursive;font-size:20px;background:var(--bg);color:var(--text);line-height:1.5;padding:30px 18px 60px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-dark)}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:34px;margin-bottom:6px}
  h2{font-size:26px;margin-bottom:14px}
  .sub{color:var(--muted);font-size:17px;margin-bottom:26px}
  a{color:var(--accent-dark)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 26px;margin-bottom:26px;box-shadow:0 10px 30px rgba(60,30,20,.07)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .tab{background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:19px;padding:8px 22px;border-radius:999px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .savechip{margin-left:auto;font-size:15px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 14px;transition:color .3s,border-color .3s}
  .savechip.pulse{color:var(--teal);border-color:var(--teal)}
  .crumb{font-size:18px;color:var(--muted);margin-bottom:12px}
  .crumb b{color:var(--text)}
  .folderrail{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .fchip{display:inline-flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:17px;padding:8px 16px;border-radius:14px;cursor:pointer;transition:border-color .2s,transform .2s}
  .fchip:hover{transform:translateY(-2px)}
  .fchip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .sw{width:20px;height:20px;border-radius:7px;flex:none}
  .ct{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  input[type=text],input[type=password],textarea{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:17px;padding:10px 12px;border-radius:10px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical}
  select,input[type=number]{background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:17px;padding:10px 12px;border-radius:10px;outline:none}
  select:focus,input[type=number]:focus{border-color:var(--accent)}
  input[type=number]{width:110px;min-width:0;flex:none}
  .file-label{display:inline-flex;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:11px 16px;cursor:pointer;font-size:17px;color:var(--muted)}
  .file-label:hover{border-color:var(--accent);color:var(--text)}
  #sPreview{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:18px;padding:10px 22px;border-radius:999px;cursor:pointer}
  .btn:hover{background:var(--accent-dark)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
  .btn.ghost:hover{color:var(--text)}
  .btn.small{font-size:15px;padding:7px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .item{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item img.ph{width:100%;height:150px;object-fit:cover;display:block}
  .phreplace{display:block;text-align:center;font-size:14px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .phreplace:hover{color:var(--accent-dark)}
  .phreplace input{display:none}
  .item .b{padding:14px 16px 16px}
  .del{display:inline-block;margin-top:8px;background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:15px;padding:4px 14px;border-radius:999px;cursor:pointer}
  .del:hover{color:#e28a97;border-color:#e28a97}
  .hint{color:var(--muted);font-size:16px;margin:4px 0 0;width:100%}
  .small{font-size:15px;color:var(--muted)}
  [hidden]{display:none!important}
  .item .b input,.item .b textarea{display:block;width:100%;margin-bottom:8px;min-width:0;background:var(--surface);font-size:16px}
  .item .b input[type=number]{width:100%}
  .badge{display:inline-block;font-size:14px;padding:3px 12px;border-radius:999px;color:#fff;margin-bottom:8px}
  .stats{display:flex;gap:8px;margin:10px 0}
  .stat{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.rem b{color:var(--teal)}
  .stat.rem.out b{color:#e28a97}
  .srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .srow input[type=number]{width:80px}
  .stocksum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .stocksum .chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:16px}
  .stocksum .chip b{color:var(--accent-dark)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Адмін-панель · Secret</h1>
  <p class="sub">Розділ → папка → характеристики. Зміни зберігаються автоматично й одразу видно на сайті в цьому браузері.</p>

  <div class="panel" id="loginPanel">
    <h2>Вхід</h2>
    <form class="row" id="loginForm">
      <input type="text" id="loginUser" placeholder="Пошта або юзернейм" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      <button class="btn" type="submit">Увійти</button>
      <p class="hint err" id="loginErr" style="color:#e28a97"></p>
    </form>
  </div>

  <div id="mainPanel" hidden>
    <div class="panel">
      <div class="tabs">
        <button class="tab on" type="button" data-sec="flowers">Квіти</button>
        <button class="tab" type="button" data-sec="coffee">Кава</button>
        <span class="savechip" id="saveChip">Автозбереження</span>
      </div>

      <p class="crumb" id="crumb"></p>
      <div class="folderrail" id="folderRail"></div>

      <div class="stocksum" id="stockSum"></div>

      <form class="row" id="addForm">
        <label class="file-label">Фото *<input type="file" id="sPhoto" accept="image/*" hidden></label>
        <img id="sPreview" alt="Обране фото" hidden>
        <input type="text" id="sName" placeholder="Назва квітки *">
        <input type="number" id="sPrice" min="0" step="1" placeholder="Ціна, грн *">
        <input type="number" id="sQty" min="1" step="1" value="1" aria-label="Кількість, шт">
        <input type="text" id="sDesc" placeholder="Опис (необов’язково)">
        <button class="btn" type="submit">Додати в папку</button>
        <p class="hint" id="addHint">Фото, назва та ціна обов’язкові. Кількість — скільки штук кладете в папку.</p>
      </form>

      <div class="grid" id="itemList" style="margin-top:16px"></div>
    </div>

    <div class="panel">
      <h2>Дані входу</h2>
      <form class="row" id="authForm">
        <input type="text" id="newUser" placeholder="Нова пошта / юзернейм" autocomplete="off">
        <input type="password" id="newPass" placeholder="Новий пароль" autocomplete="new-password">
        <button class="btn ghost" type="submit">Зберегти</button>
      </form>
      <p style="margin-top:12px"><button class="del" type="button" id="logoutBtn">Вийти</button></p>
    </div>
  </div>
</div>

<script>
(function(){
  var LS_AUTH='secret_admin_auth', LS_ON='secret_admin_on', LS_DRAFT='secret_admin_draft', LS_LIVE='secret_live_menu';
  var DEF_USER='admin', DEF_PASS='secret2026';
  var CATS={
    roses:{label:'Троянди',c1:'#7a2733',c2:'#e8a7b8'},
    peonies:{label:'Піони',c1:'#7c4a5e',c2:'#f0bccb'},
    tulips:{label:'Тюльпани',c1:'#8a4030',c2:'#f2b09a'},
    daisies:{label:'Ромашки',c1:'#5f7a3a',c2:'#f0e3a0'}
  };
  var COFFEE_FOLDERS=[{key:'menu',label:'Кавове меню',c1:'#5c3a22',c2:'#d9a866'}];
  var state={flowers:[],drinks:[],coffee:[],stock:[]};
  var sec='flowers', folder='roses';
  function $(id){return document.getElementById(id);}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
  function sha256(txt){
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(buf){
        return [].map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
      });
    }
    return Promise.resolve('plain:'+txt);
  }
  function loadAuth(){try{var a=JSON.parse(localStorage.getItem(LS_AUTH));if(a&&typeof a==='object'&&a.user&&a.hash)return a;}catch(e){}return null;}
  function isLogged(){return localStorage.getItem(LS_ON)==='1';}
  function rem(it){return Math.max(0,(it.total||0)-(it.sold||0));}
  function grad(f){return 'linear-gradient(135deg,'+f.c1+','+f.c2+')';}

  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var u=$('loginUser').value.trim(), p=$('loginPass').value;
    if(!u||!p){$('loginErr').textContent='Заповніть обидва поля.';return;}
    var a=loadAuth();
    sha256(p).then(function(h){
      var ok;
      if(a){ok=(u===a.user&&h===a.hash);}
      else{
        ok=(u===DEF_USER&&p===DEF_PASS);
        if(ok){try{localStorage.setItem(LS_AUTH,JSON.stringify({user:DEF_USER,hash:h}));}catch(err){}}
      }
      if(ok){
        localStorage.setItem(LS_ON,'1');
        $('loginErr').textContent='';
        $('loginForm').reset();
        enter();
      }else{
        $('loginErr').textContent='Невірні дані для входу.';
      }
    });
  });

  function enter(){
    $('loginPanel').hidden=true;
    $('mainPanel').hidden=false;
    loadState();
  }
  function loadState(){
    var d=loadDraft();
    if(d&&(d.stock.length||d.coffee.length)){state=d;render();return;}
    fetch('menu.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      if(j&&Array.isArray(j.flowers)&&Array.isArray(j.drinks)){
        state={flowers:j.flowers,drinks:j.drinks,coffee:Array.isArray(j.coffee)?j.coffee:[],stock:Array.isArray(j.stock)?j.stock:[]};
      }else throw 0;
      saveDraft();
    }).catch(function(){
      if(d)state=d;
    }).then(render);
  }
  function loadDraft(){
    try{
      var d=JSON.parse(localStorage.getItem(LS_DRAFT));
      if(d&&Array.isArray(d.flowers)&&Array.isArray(d.drinks))
        return {flowers:d.flowers,drinks:d.drinks,coffee:Array.isArray(d.coffee)?d.coffee:[],stock:Array.isArray(d.stock)?d.stock:[]};
    }catch(e){}
    return null;
  }
  var chipTimer=null;
  function saveDraft(){
    try{
      localStorage.setItem(LS_DRAFT,JSON.stringify(state));
      localStorage.setItem(LS_LIVE,JSON.stringify({stock:state.stock,coffee:state.coffee}));
      var chip=$('saveChip');
      chip.textContent='Збережено ✓';chip.classList.add('pulse');
      clearTimeout(chipTimer);
      chipTimer=setTimeout(function(){chip.textContent='Автозбереження';chip.classList.remove('pulse');},1400);
    }catch(e){}
  }

  function folders(){return sec==='flowers'?Object.keys(CATS).map(function(k){return {key:k,label:CATS[k].label,c1:CATS[k].c1,c2:CATS[k].c2};}):COFFEE_FOLDERS;}
  function countIn(key){
    if(sec==='flowers')return state.stock.filter(function(it){return it.cat===key;}).length;
    return state.coffee.length;
  }

  function render(){
    [].forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('on',t.getAttribute('data-sec')===sec);});
    var fs=folders();
    if(!fs.some(function(f){return f.key===folder;}))folder=fs[0].key;
    var cur=fs.filter(function(f){return f.key===folder;})[0];
    $('crumb').innerHTML=(sec==='flowers'?'Квіти':'Кава')+' → <b>'+esc(cur.label)+'</b>';
    var rail=$('folderRail');rail.innerHTML='';
    fs.forEach(function(f){
      var b=document.createElement('button');b.type='button';b.className='fchip'+(f.key===folder?' on':'');
      b.innerHTML='<span class="sw" style="background:'+grad(f)+'"></span>'+esc(f.label)+'<span class="ct">'+countIn(f.key)+'</span>';
      b.onclick=function(){folder=f.key;render();};
      rail.appendChild(b);
    });
    var isFl=(sec==='flowers');
    $('addForm').hidden=!isFl;
    $('stockSum').hidden=!isFl;
    if(isFl){renderSum();renderFlowers();}
    else renderCoffee();
  }
  function renderSum(){
    var items=state.stock.filter(function(it){return it.cat===folder;});
    var tot=0,sold=0,left=0;
    items.forEach(function(it){tot+=it.total||0;sold+=it.sold||0;left+=rem(it);});
    $('stockSum').innerHTML='<span class="chip">На складі: <b>'+left+' шт</b></span><span class="chip">Продано: <b>'+sold+' шт</b></span><span class="chip">Всього було: <b>'+tot+' шт</b></span>';
    $('addHint').textContent=items.length?'Залишок = всього − продано. Сайт показує саме залишок.':'Папка поки порожня — додайте першу квітку вище.';
  }
  function readPhoto(f,done){
    var url=URL.createObjectURL(f), im=new Image();
    im.onload=function(){
      var max=900,w=im.width,h=im.height;
      if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      done(cv.toDataURL('image/jpeg',0.72));
    };
    im.onerror=function(){URL.revokeObjectURL(url);alert('Не вдалося прочитати фото.');};
    im.src=url;
  }
  function renderFlowers(){
    var list=$('itemList');list.innerHTML='';
    var items=[];
    state.stock.forEach(function(it,idx){if(it.cat===folder)items.push({it:it,idx:idx});});
    if(!items.length){list.innerHTML='<p class="hint">У цій папці поки немає квітів.</p>';return;}
    items.forEach(function(o){
      var it=o.it,idx=o.idx,c=CATS[it.cat]||CATS.roses;
      var el=document.createElement('div');el.className='item';
      var ph=document.createElement('img');ph.className='ph';ph.src=it.img||'';ph.alt=it.n||'';el.appendChild(ph);
      var rep=document.createElement('label');rep.className='phreplace';rep.textContent='Замінити фото';
      var fi=document.createElement('input');fi.type='file';fi.accept='image/*';
      fi.addEventListener('change',function(){var f=fi.files[0];if(f)readPhoto(f,function(data){state.stock[idx].img=data;saveDraft();render();});});
      rep.appendChild(fi);el.appendChild(rep);
      var b=document.createElement('div');b.className='b';
      var badge=document.createElement('span');badge.className='badge';badge.style.background=grad(c);badge.textContent=c.label;b.appendChild(badge);
      var nm=document.createElement('input');nm.type='text';nm.value=it.n||'';nm.placeholder='Назва *';
      nm.addEventListener('input',function(){state.stock[idx].n=nm.value.trim();saveDraft();});
      b.appendChild(nm);
      var pr=document.createElement('input');pr.type='number';pr.min='0';pr.step='1';pr.value=it.price||0;pr.placeholder='Ціна, грн';
      pr.addEventListener('input',function(){state.stock[idx].price=Math.max(0,parseInt(pr.value,10)||0);saveDraft();});
      b.appendChild(pr);
      var ds=document.createElement('textarea');ds.rows=2;ds.value=it.d||'';ds.placeholder='Опис (необов’язково)';
      ds.addEventListener('input',function(){state.stock[idx].d=ds.value.trim();saveDraft();});
      b.appendChild(ds);
      var r=rem(it);
      var stats=document.createElement('div');stats.className='stats';
      stats.innerHTML='<div class="stat"><b>'+(it.total||0)+'</b><span>всього</span></div><div class="stat"><b>'+(it.sold||0)+'</b><span>продано</span></div><div class="stat rem'+(r>0?'':' out')+'"><b>'+r+'</b><span>залишок</span></div>';
      b.appendChild(stats);
      var row=document.createElement('div');row.className='srow';
      var q=document.createElement('input');q.type='number';q.min='1';q.step='1';q.value='1';q.setAttribute('aria-label','Кількість, шт');
      var plus=document.createElement('button');plus.type='button';plus.className='btn ghost small';plus.textContent='＋ партія';
      plus.title='Додати кількість до «всього»';
      plus.onclick=function(){var n=Math.max(1,parseInt(q.value,10)||1);state.stock[idx].total=(state.stock[idx].total||0)+n;saveDraft();render();};
      var sell=document.createElement('button');sell.type='button';sell.className='btn small';sell.textContent='Продано';
      sell.title='Записати продаж — зменшить залишок';
      sell.onclick=function(){var n=Math.max(1,parseInt(q.value,10)||1);state.stock[idx].sold=Math.min(state.stock[idx].total||0,(state.stock[idx].sold||0)+n);saveDraft();render();};
      row.appendChild(q);row.appendChild(plus);row.appendChild(sell);
      b.appendChild(row);
      var del=document.createElement('button');del.type='button';del.className='del';del.textContent='Видалити';
      del.onclick=function(){state.stock.splice(idx,1);saveDraft();render();};
      b.appendChild(del);
      el.appendChild(b);list.appendChild(el);
    });
  }
  function renderCoffee(){
    var list=$('itemList');list.innerHTML='';
    if(!state.coffee.length){list.innerHTML='<p class="hint">Кавових напоїв поки немає.</p>';return;}
    state.coffee.forEach(function(it,idx){
      var el=document.createElement('div');el.className='item';
      var b=document.createElement('div');b.className='b';
      var badge=document.createElement('span');badge.className='badge';badge.style.background=grad(COFFEE_FOLDERS[0]);badge.textContent='Наливання';b.appendChild(badge);
      var nm=document.createElement('input');nm.type='text';nm.value=it.n||'';nm.placeholder='Назва *';
      nm.addEventListener('input',function(){state.coffee[idx].n=nm.value.trim();saveDraft();});
      b.appendChild(nm);
      var sb=document.createElement('input');sb.type='text';sb.value=it.sub||'';sb.placeholder='Підпис (об’єм · характер)';
      sb.addEventListener('input',function(){state.coffee[idx].sub=sb.value.trim();saveDraft();});
      b.appendChild(sb);
      var ds=document.createElement('textarea');ds.rows=2;ds.value=it.d||'';ds.placeholder='Опис (необов’язково)';
      ds.addEventListener('input',function(){state.coffee[idx].d=ds.value.trim();saveDraft();});
      b.appendChild(ds);
      var note=document.createElement('p');note.className='hint';note.style.margin='0 0 8px';note.textContent='Посудина та шари наливання задані рецептом.';
      b.appendChild(note);
      var del=document.createElement('button');del.type='button';del.className='del';del.textContent='Видалити';
      del.onclick=function(){state.coffee.splice(idx,1);saveDraft();render();};
      b.appendChild(del);
      el.appendChild(b);
      list.appendChild(el);
    });
  }
  [].forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){
      sec=t.getAttribute('data-sec');
      folder=sec==='flowers'?'roses':'menu';
      render();
    });
  });
  $('sPhoto').addEventListener('change',function(){
    var f=this.files[0],pv=$('sPreview');
    if(f){pv.src=URL.createObjectURL(f);pv.hidden=false;}else{pv.hidden=true;}
  });
  $('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('sName').value.trim();
    var qty=Math.max(1,parseInt($('sQty').value,10)||1);
    var desc=$('sDesc').value.trim();
    var f=$('sPhoto').files[0];
    if(!name){alert('Введіть назву квітки.');return;}
    if(!$('sPrice').value){alert('Вкажіть ціну в грн.');return;}
    var price=Math.max(0,parseInt($('sPrice').value,10)||0);
    if(!f){alert('Додайте фото квітки.');return;}
    readPhoto(f,function(data){
      var it={id:'f'+Date.now().toString(36)+Math.floor(Math.random()*1e4),cat:folder,n:name,price:price,total:qty,sold:0,img:data};
      if(desc)it.d=desc;
      state.stock.push(it);
      saveDraft();render();
      $('sName').value='';$('sPrice').value='';$('sQty').value='1';$('sDesc').value='';$('sPhoto').value='';$('sPreview').hidden=true;
    });
  });
  $('authForm').addEventListener('submit',function(e){
    e.preventDefault();
    var u=$('newUser').value.trim(), p=$('newPass').value;
    if(!u||!p){alert('Введіть нові пошту/юзернейм і пароль.');return;}
    sha256(p).then(function(h){
      try{localStorage.setItem(LS_AUTH,JSON.stringify({user:u,hash:h}));}catch(err){}
      $('newUser').value='';$('newPass').value='';
      alert('Дані входу збережено.');
    });
  });
  $('logoutBtn').addEventListener('click',function(){
    localStorage.removeItem(LS_ON);
    $('mainPanel').hidden=true;
    $('loginPanel').hidden=false;
  });
  if(isLogged()){enter();}
})();
</script>
</body>
</html>
